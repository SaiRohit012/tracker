name: Audit company sources
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m scraper.validate_urls --json reports/url-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-source-audit
          path: reports/url-audit.json
          retention-days: 30
